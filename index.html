<div id="cmb" class="g" style="display:none;position:absolute;left:216px;top:68px;width:1056px;height:422px;z-index:6;background:rgba(11,27,58,.97);box-sizing:border-box;gap:10px;grid-template-columns:500px 1fr"><div><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">🧩 Gabungkan Bangun (maks. 3)</h3><button id="cx" style="min-height:34px">✖ Tutup</button></div><canvas id="cv2" width="480" height="190" style="margin-top:4px"></canvas><div id="cs"></div></div><div id="ci" class="res" style="overflow:auto;font-size:13px"></div></div>
</div>
<script>
const $=id=>document.getElementById(id),PI=Math.PI,fmt=n=>(Math.round(n*100)/100).toLocaleString('id-ID');
const M={
kubus:{n:'Kubus',v:{s:['Rusuk s',1,20,6]},r:['6s²','s³'],c:'6 sisi persegi · 12 rusuk · 8 titik sudut · 4 diagonal ruang · 6 bidang diagonal'},
balok:{n:'Balok',v:{p:['Panjang p',1,20,8],l:['Lebar l',1,20,5],t:['Tinggi t',1,20,4]},r:['2(pl+pt+lt)','p×l×t'],c:'6 sisi persegi panjang · 12 rusuk · 8 titik sudut · 4 diagonal ruang · 6 bidang diagonal'},
prisma:{n:'Prisma segi-6',v:{a:['Sisi alas a',1,15,6],t:['Tinggi t',1,20,10]},r:['6at + 2·(3√3/2)a²','(3√3/2)a²·t'],c:'8 sisi (2 alas + 6 tegak) · 18 rusuk · 12 titik sudut'},
limas:{n:'Limas persegi',v:{s:['Sisi alas s',1,20,10],t:['Tinggi t',1,20,12]},r:['s² + 2s·√(t²+(s/2)²)','⅓·s²·t'],c:'5 sisi · 8 rusuk · 5 titik sudut'},
prismaseg:{n:'Prisma segitiga',v:{a:['Sisi alas a',1,15,6],t:['Tinggi t',1,20,10]},r:['3at + 2·(√3/4)a²','(√3/4)a²·t'],c:'5 sisi (2 alas segitiga + 3 tegak) · 9 rusuk · 6 titik sudut (A–F)'},
limasseg:{n:'Limas segitiga',v:{a:['Sisi alas a',1,15,8],t:['Tinggi t',1,20,9]},r:['(√3/4)a² + 3·½·a·√(t²+(a√3/6)²)','⅓·(√3/4)a²·t'],c:'4 sisi (alas + 3 tegak) · 6 rusuk · 4 titik sudut (A, B, C, T)'},
tabung:{n:'Tabung',v:{r:['Jari-jari r',1,15,7],t:['Tinggi t',1,25,15]},r:['2πr(r+t)','πr²t'],c:'3 sisi (2 alas lingkaran + selimut) · 2 rusuk lengkung · 0 titik sudut'},
kerucut:{n:'Kerucut',v:{r:['Jari-jari r',1,15,6],t:['Tinggi t',1,25,8]},r:['πr(r+s), s=√(r²+t²)','⅓πr²t'],c:'2 sisi (alas + selimut) · 1 rusuk lengkung · 1 titik sudut (puncak)'},
bola:{n:'Bola',v:{r:['Jari-jari r',1,15,6]},r:['4πr²','4/3·πr³'],c:'1 sisi lengkung · 0 rusuk · 0 titik sudut'},
ling:{n:'Lingkaran',v:{r:['Jari-jari r',1,20,14],d:['Sudut juring °',10,360,90]},r:['Busur = θ/360·2πr','Juring = θ/360·πr²'],c:'Keliling = 2πr · Luas = πr² · busur dan juring sebanding dengan sudut pusat θ'}};
const S={m:'kubus',v:{},f:0,ft:0,w:0,wt:0,ang:.6,A:null,B:null,done:new Set(),vis:new Set(['kubus']),bd:new Set(),score:0,ok:{},tr:{},cur:0,drag:0,ling:0};
const STEPS=['Pilih Bangun','Atur Variabel','Jalankan','Amati','Bandingkan','Simpulkan'],TIPS=['Halo! Pilih satu bangun di kiri.','Geser slider dan lihat angka berubah.','Coba Buka Jaring atau aktifkan penanda rusuk dan diagonal.','Amati hasil luas dan volume.','Simpan skenario A, ubah, lalu simpan B.','Tulis refleksimu di kanan bawah.','Hebat! Lanjut ke tantangan HOTS.'];
const BADGES={pb:'Penjelajah Bangun',aj:'Arsitek Jaring',dl:'Detektif Lingkaran',jh:'Juara HOTS'};
let au;function beep(f=660){try{au=au||new(window.AudioContext||window.webkitAudioContext)();const o=au.createOscillator(),g=au.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(au.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,au.currentTime+.15);o.stop(au.currentTime+.16)}catch(e){}}
function mark(i){if(!S.done.has(i)){S.done.add(i);beep(880)}ui()}
function badge(k){if(!S.bd.has(k)){S.bd.add(k);beep(1040);$('tip').textContent='🎉 Badge baru: '+BADGES[k]+'!'}ui()}
function ui(){$('chips').innerHTML=STEPS.map((s,i)=>`<span class="chip ${S.done.has(i)?'d':''}">${i+1} ${s}</span>`).join('');const p=Math.round(S.done.size/6*100);$('pbf').style.width=p+'%';$('pp').textContent=p+'%';$('sc').textContent=S.score;const n=S.bd.size;$('lvn').textContent=n>=5?'Master':n>=3?'Arsitek':n>=1?'Penjelajah':'Pemula';
 $('bds').innerHTML=Object.keys(BADGES).map(k=>`<span class="bd ${S.bd.has(k)?'on':''}">🏅 ${BADGES[k]}</span>`).join('');
 const nx=[...Array(6).keys()].find(i=>!S.done.has(i));if(!$('tip').textContent.startsWith('🎉'))$('tip').textContent=TIPS[nx===undefined?6:nx];concl()}
function calc(){const v=S.v,m=S.m;let L=0,V=null,x='';
 if(m=='kubus'){L=6*v.s*v.s;V=v.s**3}else if(m=='balok'){L=2*(v.p*v.l+v.p*v.t+v.l*v.t);V=v.p*v.l*v.t}
 else if(m=='prisma'){const A=3*Math.sqrt(3)/2*v.a*v.a;L=6*v.a*v.t+2*A;V=A*v.t}
 else if(m=='limas'){const sl=Math.hypot(v.t,v.s/2);L=v.s*v.s+2*v.s*sl;V=v.s*v.s*v.t/3}
 else if(m=='tabung'){L=2*PI*v.r*(v.r+v.t);V=PI*v.r*v.r*v.t}
 else if(m=='kerucut'){L=PI*v.r*(v.r+Math.hypot(v.r,v.t));V=PI*v.r*v.r*v.t/3}
 else if(m=='prismaseg'){const A=Math.sqrt(3)/4*v.a*v.a;L=3*v.a*v.t+2*A;V=A*v.t}
 else if(m=='limasseg'){const A=Math.sqrt(3)/4*v.a*v.a,sl=Math.hypot(v.t,v.a*Math.sqrt(3)/6);L=A+1.5*v.a*sl;V=A*v.t/3}
 else if(m=='bola'){L=4*PI*v.r*v.r;V=4/3*PI*v.r**3}
 else{L=PI*v.r*v.r;x=`<div>Keliling = <b>${fmt(2*PI*v.r)}</b></div><div>Panjang busur = <b>${fmt(v.d/360*2*PI*v.r)}</b></div><div>Luas juring = <b>${fmt(v.d/360*L)}</b></div>`}
 return{L,V,x}}
const vs=()=>Object.keys(M[S.m].v).map(k=>k+'='+S.v[k]).join(', ');
function res(){const c=calc(),m=M[S.m];$('res').innerHTML=`<div><b>Bangun:</b> ${m.n}</div><div><b>Variabel:</b> ${vs()} (cm)</div><div class="fm">${S.m=='ling'?m.r.join('<br>'):'L = '+m.r[0]+'<br>V = '+m.r[1]}</div><div>${S.m=='ling'?'Luas lingkaran':'Luas permukaan'} = <b>${fmt(c.L)} cm²</b></div>${c.V!=null?`<div>Volume = <b>${fmt(c.V)} cm³</b> (${fmt(c.V/1000)} L)</div>`:''}${c.x}`;
 $('card').innerHTML='<b style="color:#22D3EE">'+m.n+':</b> '+m.c;inv();concl()}
function sliders(){const m=M[S.m];$('sls').innerHTML=Object.entries(m.v).map(([k,a])=>`<div class="sl"><label>${a[0]}<b id="o${k}">${S.v[k]}</b></label><input type="range" id="s${k}" min="${a[1]}" max="${a[2]}" value="${S.v[k]}" step="1"></div>`).join('');
 Object.keys(m.v).forEach(k=>$('s'+k).oninput=e=>{S.v[k]=+e.target.value;$('o'+k).textContent=S.v[k];mark(1);res();if(S.m=='ling'&&k=='d'&&S.ling++>3)badge('dl')})}
function pick(k){S.m=k;S.v={};for(const a in M[k].v)S.v[a]=M[k].v[a][3];S.vis.add(k);S.f=S.ft=0;$('bNet').classList.remove('on');$('bNet').textContent='📐 Buka Jaring';
 document.querySelectorAll('#left button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));document.querySelectorAll('#left details').forEach(d=>d.open=!!d.querySelector('button.on'));mark(0);if(S.vis.size>=5)badge('pb');sliders();setIm();res()}
[['🧊 Bangun Ruang Sisi Datar',['kubus','balok','prisma','prismaseg','limas','limasseg']],['🛢️ Bangun Ruang Sisi Lengkung',['tabung','kerucut','bola','ling']]].forEach(([t,ks])=>{const d=document.createElement('details');d.open=true;d.innerHTML='<summary>'+t+'</summary><div class="dg"></div>';ks.forEach(k=>{const b=document.createElement('button');b.textContent=M[k].n;b.dataset.k=k;b.onclick=()=>pick(k);d.lastChild.appendChild(b)});$('left').appendChild(d)});
$('bNet').onclick=function(){if(S.m=='ling'||S.m=='bola'){$('tip').textContent='Bentuk ini tidak punya jaring datar. Coba bangun lain!';return}S.ft=S.ft?0:1;this.textContent=S.ft?'📦 Lipat Jaring':'📐 Buka Jaring';this.classList.toggle('on',!!S.ft);badge('aj');mark(2);setTimeout(()=>mark(3),1500);beep(520)};
['A','B'].forEach(k=>$('s'+k).onclick=()=>{const c=calc();S[k]={n:M[S.m].n,vs:vs(),L:c.L,V:c.V};if(S.A&&S.B)mark(4);cmp();beep()});
function cmp(){const a=S.A,b=S.B;if(!a&&!b){$('cmp').innerHTML='';return}const mx=Math.max(a?a.L:0,b?b.L:0),mv=Math.max(a&&a.V||0,b&&b.V||0);
 const row=(o,l,c)=>o?`<tr><td style="color:${c}"><b>${l}</b> ${o.n}<br>${o.vs}</td><td>L ${fmt(o.L)}<div class="bar" style="width:${o.L/mx*100}%;background:${c}"></div>${o.V!=null?'V '+fmt(o.V)+'<div class="bar" style="width:'+(mv?o.V/mv*100:0)+'%;background:'+c+'"></div>':''}</td></tr>`:'';
 $('cmp').innerHTML='<table>'+row(a,'A','#22D3EE')+row(b,'B','#FBBF24')+'</table>'+(a&&b&&a.V&&b.V?`<div>V(B)/V(A) = <b>${fmt(b.V/a.V)}×</b>; L(B)/L(A) = <b>${fmt(b.L/a.L)}×</b></div>`:'');concl()}
function concl(){const c=calc(),n=Object.values(S.ok).filter(Boolean).length;$('cc').innerHTML=`Kamu menjelajah <b>${S.vis.size}</b> bangun (${[...S.vis].map(k=>M[k].n).join(', ')}). Terakhir: <b>${M[S.m].n}</b> (${vs()}) dengan luas ${fmt(c.L)} cm²${c.V!=null?' dan volume '+fmt(c.V)+' cm³':''}.${S.A&&S.B&&S.A.V&&S.B.V?` Perubahan A→B membuat volume ${fmt(S.B.V/S.A.V)}× dan luas ${fmt(S.B.L/S.A.L)}×.`:''} HOTS benar: <b>${n}/40</b>.`}
$('rf').oninput=e=>{if(e.target.value.trim().length>=10)mark(5)};
// ---- geometry
const ring=(n,r,y)=>Array.from({length:n+1},(_,i)=>[r*Math.cos(2*PI*i/n),y,r*Math.sin(2*PI*i/n)]);
const box=(w,h,d)=>{const x=w/2,z=d/2,y=h/2,b=[[-x,-y,-z],[x,-y,-z],[x,-y,z],[-x,-y,z],[-x,-y,-z]],t=b.map(p=>[p[0],y,p[2]]);return[b,t,...[0,1,2,3].map(i=>[b[i],t[i]])]};
function geo(){const v=S.v;switch(S.m){case'kubus':return box(v.s,v.s,v.s);case'balok':return box(v.p,v.t,v.l);
 case'prisma':{const b=ring(6,v.a,-v.t/2),t=ring(6,v.a,v.t/2);return[b,t,...[0,1,2,3,4,5].map(i=>[b[i],t[i]])]}
 case'prismaseg':{const R=v.a/Math.sqrt(3),b=ring(3,R,-v.t/2),t=ring(3,R,v.t/2);return[b,t,...[0,1,2].map(i=>[b[i],t[i]])]}
 case'limasseg':{const R=v.a/Math.sqrt(3),h=v.t/2,b=ring(3,R,-h);return[b,...[0,1,2].map(i=>[b[i],[0,h,0]])]}
 case'limas':{const h=v.t/2,s=v.s/2,b=[[-s,-h,-s],[s,-h,-s],[s,-h,s],[-s,-h,s],[-s,-h,-s]];return[b,...[0,1,2,3].map(i=>[b[i],[0,h,0]])]}
